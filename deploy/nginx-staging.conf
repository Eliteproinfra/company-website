# nginx site config for the staging deploy — new.eliteproinfra.com
#
# Install on the VPS as:
#   /etc/nginx/sites-available/new.eliteproinfra.com
# then symlink into sites-enabled and reload. See deploy/README.md.
#
# This file contains the plain HTTP (port 80) server only. Run certbot after
# installing it — certbot rewrites this file in place, adding the port 443
# server block and the HTTP->HTTPS redirect itself. Do not hand-write TLS here.

server {
    listen 80;
    listen [::]:80;
    server_name new.eliteproinfra.com;

    # The career form mails a resume of up to 5MB (app/api/career-application).
    # nginx defaults to 1m, which would reject those uploads with a 413 before
    # they ever reach Next.js. 8m leaves room for multipart overhead.
    client_max_body_size 8m;

    # Hashed build assets are immutable — let the browser cache them hard and
    # keep those requests off the Node process entirely.
    location /_next/static/ {
        alias /var/www/eliteproinfra/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Next.js App Router streams responses. With buffering on, nginx holds
        # the whole response before sending, which defeats streaming and makes
        # slow pages feel slower.
        proxy_buffering off;

        # Sending a 5MB resume upstream can outlast the 60s default on a slow
        # connection; the SMTP send then adds to the read time.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Staging must never be indexed — the real site is on the apex domain.
    # This overrides the app's own /robots.txt route for this hostname only.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
