# nginx site config for PRODUCTION — eliteproinfra.com + www.
#
# Install on the instance as:
#   /etc/nginx/sites-available/eliteproinfra
# then symlink into sites-enabled, `nginx -t`, reload. See deploy/AWS.md.
#
# DIFFERENCES FROM nginx-aws.conf (the staging file):
#   - serves the apex and www instead of new.eliteproinfra.com
#   - NO /robots.txt override. That block exists only to keep a staging host
#     out of Google; leaving it here would deindex the real site.
#   - TLS blocks are written out explicitly rather than letting `certbot
#     --nginx` rewrite the file, because the certificate is obtained by DNS-01
#     BEFORE the domain is pointed at this server, so there is no nginx-based
#     authenticator run to do the rewriting.
#   - www 301s to the apex: app/layout.tsx sets metadataBase to
#     https://eliteproinfra.com and app/sitemap.ts emits apex URLs, so the apex
#     is canonical and www must not serve a duplicate of the whole site.
#
# THIS FILE REFERENCES CERTIFICATE PATHS. `nginx -t` fails if they do not
# exist yet, so install it only after certbot has issued the certificate.

# ---------------------------------------------------------------- HTTP :80
# Serves only the ACME challenge and the redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name eliteproinfra.com www.eliteproinfra.com;

    # Let's Encrypt renewals switch to webroot HTTP-01 after cutover, which is
    # far simpler than manual DNS and renews unattended. This location must
    # stay reachable over plain HTTP and must come before the redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://eliteproinfra.com$request_uri;
    }
}

# --------------------------------------------------------- HTTPS www -> apex
server {
    # nginx 1.24 (Ubuntu 24.04) does not support the `http2 on;` directive that
    # 1.25.1+ introduced; HTTP/2 is enabled on the listen line instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eliteproinfra.com;

    ssl_certificate     /etc/letsencrypt/live/eliteproinfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eliteproinfra.com/privkey.pem;
    include /etc/nginx/snippets/ssl-eliteproinfra.conf;

    return 301 https://eliteproinfra.com$request_uri;
}

# ------------------------------------------------------------- HTTPS apex
server {
    # nginx 1.24 (Ubuntu 24.04) does not support the `http2 on;` directive that
    # 1.25.1+ introduced; HTTP/2 is enabled on the listen line instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eliteproinfra.com;

    ssl_certificate     /etc/letsencrypt/live/eliteproinfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eliteproinfra.com/privkey.pem;
    include /etc/nginx/snippets/ssl-eliteproinfra.conf;

    # Two limits have to fit under this: the 5MB career resume
    # (app/api/career-application) and the 8MB admin image upload
    # (app/api/admin/upload, MAX_BYTES). 8m is too tight for the latter once
    # multipart overhead is counted, which would produce an nginx 413 before
    # Next.js could return its own readable error.
    client_max_body_size 12m;

    server_tokens off;

    # --- security headers -------------------------------------------------
    # HSTS: only valid here, on the TLS vhost, and only correct once HTTPS is
    # known good. 6 months, no preload and no includeSubDomains — other
    # subdomains (crm., ftp., mail autodiscover) are outside this server's
    # control and some do not serve HTTPS at all.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No Content-Security-Policy yet: the site loads Google Fonts, embeds a
    # Google Maps iframe, pulls Instagram CDN images and inlines schema.org
    # JSON-LD. A CSP must be written and tested against all four before it can
    # be turned on, or it will silently break the page.

    access_log /var/log/nginx/eliteproinfra.access.log;
    error_log  /var/log/nginx/eliteproinfra.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # --- static assets ----------------------------------------------------
    # Hashed build output is immutable. Path goes through the `current`
    # symlink so it follows the active release.
    location /_next/static/ {
        alias /var/www/eliteproinfra/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Admin uploads live outside the release directories so they survive
    # deploys and rollbacks.
    location /uploads/ {
        alias /var/www/eliteproinfra/shared/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        # User-supplied files: never let a browser reinterpret one as HTML or
        # script, whatever its extension claims.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
    }

    # --- health -----------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # --- application ------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Must be $scheme, not a literal: Next.js and the Server Actions origin
        # check rely on knowing the request arrived over HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # The App Router streams responses; buffering would hold the whole
        # response before sending and defeat it.
        proxy_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
