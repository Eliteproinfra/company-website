# Shared TLS parameters. Installed as /etc/nginx/snippets/ssl-eliteproinfra.conf
# and included by both HTTPS server blocks in nginx-production.conf.
#
# Written out explicitly rather than including certbot's
# /etc/letsencrypt/options-ssl-nginx.conf, because that file only exists if the
# nginx authenticator has run — and here the first certificate was obtained
# with the webroot authenticator, which does not install it. Depending on it
# made `nginx -t` fail on a box that had a perfectly good certificate.
#
# No ssl_dhparam: the cipher list below is ECDHE-only, so the finite-field
# Diffie-Hellman parameters are never used. That also avoids generating a
# 2048-bit dhparam file, which takes minutes on a 2-vCPU instance.

ssl_protocols TLSv1.2 TLSv1.3;

# Let the client choose among these; all are forward-secret AEAD suites.
# TLS 1.3 suites are negotiated separately and are not configurable here.
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:EliteSSL:10m;
ssl_session_timeout 1d;
# Session tickets without rotation weaken forward secrecy; nginx has no
# built-in rotation, so they stay off.
ssl_session_tickets off;

# No OCSP stapling. Let's Encrypt retired OCSP and its certificates no longer
# carry an responder URL, so nginx ignores the directives and logs
# "ssl_stapling ignored, no OCSP responder URL in the certificate" on every
# config test. Revocation is handled by the short 90-day lifetime and by CRLs
# instead. Do not re-add these without first checking the issued certificate
# actually has an OCSP URI:
#   openssl x509 -in /etc/letsencrypt/live/eliteproinfra.com/cert.pem -noout -ocsp_uri
