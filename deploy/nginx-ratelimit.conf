# Rate-limit zones. Installed as /etc/nginx/conf.d/elitepro-ratelimit.conf.
#
# limit_req_zone is only valid in the http context, which is why these live in
# conf.d rather than inside the site's server block. The per-location
# `limit_req` directives that use them are in nginx-production.conf.
#
# SCOPE IS DELIBERATELY NARROW. These apply only to the three endpoints that
# are actually abusable, never to page or asset requests. A single page view
# pulls many /_next/static files, so a global limit risks throttling real
# visitors mid-page for no security benefit.
#
# $binary_remote_addr, not $remote_addr: 4 bytes per IPv4 entry instead of up
# to 15, so a 10m zone tracks roughly 160k addresses.

# Public form submissions -> app/api/enquiry and app/api/career-application.
#
# THIS IS THE IMPORTANT ONE. /api/enquiry takes an unauthenticated POST and
# sends mail through the company's Google Workspace account. Its only existing
# guard is a honeypot field, which stops naive bots and nothing else. Left
# open it is a spam relay that burns the domain's sending reputation.
#
# 6/minute with burst 3: a genuine visitor submits once, maybe twice after a
# correction. Anything sustained above that is not a customer.
limit_req_zone $binary_remote_addr zone=elite_forms:10m rate=6r/m;

# Admin sign-in -> app/admin/login (the page GET and the Server Action POST
# share this path).
#
# scrypt at N=32768 already makes each guess cost ~100ms of server CPU, which
# is a throttle of sorts but also a cheap way for an attacker to pin the CPU.
# 20/minute leaves room for a mistyped password and a page reload while making
# online brute force useless.
limit_req_zone $binary_remote_addr zone=elite_login:10m rate=20r/m;

# Authenticated admin image upload -> app/api/admin/upload. Already behind a
# session check and 8MB limit; this just bounds how fast a compromised or
# careless session can fill the disk.
limit_req_zone $binary_remote_addr zone=elite_upload:10m rate=30r/m;

# Return 429 Too Many Requests rather than nginx's default 503, which would
# wrongly suggest the site is down.
limit_req_status 429;

# Rejections are worth seeing without turning on full debug logging.
limit_req_log_level warn;
