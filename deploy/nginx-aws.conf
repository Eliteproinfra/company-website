# nginx site config for the AWS EC2 deployment.
#
# Install on the instance as:
#   /etc/nginx/sites-available/eliteproinfra
# then symlink into sites-enabled, `nginx -t`, and reload. See deploy/AWS.md.
#
# Plain HTTP (port 80) only. Certbot rewrites this file in place, adding the
# port 443 server block and the HTTP->HTTPS redirect. Do not hand-write TLS
# here — certbot needs to own those lines to renew cleanly.
#
# DIFFERENCES FROM nginx-staging.conf (the Hostinger VPS file, left untouched):
#   - paths go through the `current` release symlink, not a fixed checkout
#   - /uploads/ is served from shared/, so uploads survive deploys
#   - client_max_body_size raised to 12m (see below)
#   - security headers added
#   - WebSocket Upgrade headers dropped: this app has none

server {
    listen 80;
    listen [::]:80;

    # Staging validation first. At cutover this becomes:
    #   server_name eliteproinfra.com www.eliteproinfra.com;
    # and the /robots.txt block below MUST be deleted, or the live site is
    # deindexed from Google.
    server_name new.eliteproinfra.com;

    # Two separate limits have to fit under this number:
    #   - career form resume, 5MB   (app/api/career-application/route.ts)
    #   - admin image upload, 8MB   (app/api/admin/upload/route.ts, MAX_BYTES)
    # The staging file used 8m, which is too tight: an image at exactly the
    # 8MB application limit exceeds 8m once multipart boundaries and headers
    # are counted, so nginx would 413 it before Next.js could return its own
    # readable error. 12m clears both with room to spare.
    client_max_body_size 12m;

    # --- security headers -------------------------------------------------
    # Applied at server level. Kept to the ones that cannot break this app;
    # HSTS is added by the TLS block in Phase 10, and CSP is deliberately
    # absent until it can be tested against the Google Maps iframe, Google
    # Fonts, the Instagram CDN images and the inline schema.org JSON-LD.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Do not advertise the exact nginx version in error pages and headers.
    server_tokens off;

    access_log /var/log/nginx/eliteproinfra.access.log;
    error_log  /var/log/nginx/eliteproinfra.error.log;

    # --- static assets ----------------------------------------------------
    # Hashed build output is immutable; cache it hard and keep it off Node.
    # The path runs through `current`, so it follows the active release.
    location /_next/static/ {
        alias /var/www/eliteproinfra/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Admin uploads live outside the release directories so they survive
    # deploys and rollbacks. Served straight off disk rather than through the
    # Node process.
    location /uploads/ {
        alias /var/www/eliteproinfra/shared/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        # These are user-supplied files. Never let a browser re-interpret one
        # as HTML or script, whatever its extension claims.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
    }

    # --- application ------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The App Router streams responses. With buffering on, nginx holds the
        # whole response before sending, which defeats streaming outright —
        # the Next.js self-hosting guide calls this out explicitly.
        proxy_buffering off;

        # A 5MB resume upload on a slow connection, plus the SMTP send that
        # follows it, can outlast the 60s defaults.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- health -----------------------------------------------------------
    # Same upstream as everything else, but never cached and not logged, so a
    # 30s monitor does not bloat the access log.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # --- staging only -------------------------------------------------------
    # DELETE THIS BLOCK AT CUTOVER. It exists so the staging hostname is never
    # indexed while the real site is still on Hostinger. Leaving it in place on
    # the production hostname would remove eliteproinfra.com from Google.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
