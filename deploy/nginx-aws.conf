# nginx site config for the AWS EC2 deployment.
#
# Install on the instance as:
#   /etc/nginx/sites-available/eliteproinfra
# then symlink into sites-enabled, `nginx -t`, and reload. See deploy/AWS.md.
#
# Plain HTTP (port 80) only. Certbot rewrites this file in place, adding the
# port 443 server block and the HTTP->HTTPS redirect. Do not hand-write TLS
# here — certbot needs to own those lines to renew cleanly.
#
# ───────────────────────────────────────────────────────────────────────────────
# DO NOT `cp` THIS OVER THE LIVE FILE.
#
# The copy on the instance has been through certbot and through cutover; this
# one has not, so it is a reference for the non-TLS parts only. Overwriting
# would drop certbot's 443 block. Apply changes from here by merging the
# individual blocks into the live file, then `nginx -t` and reload. See
# AWS.md §13.
# ───────────────────────────────────────────────────────────────────────────────
#
# DIFFERENCES FROM nginx-staging.conf (the Hostinger VPS file, left untouched):
#   - paths go through the `current` release symlink, not a fixed checkout
#   - /uploads/ is served from shared/, so uploads survive deploys
#   - client_max_body_size raised to 12m (see below)
#   - security headers added
#   - WebSocket Upgrade headers dropped: this app has none

server {
    listen 80;
    listen [::]:80;

    # Cutover is done — the live site answers on the apex, confirmed against
    # https://eliteproinfra.com/health and /robots.txt. This line used to read
    # `new.eliteproinfra.com` with a note to change it at cutover; the live file
    # was changed and this one was not, which is why the warning above exists.
    server_name eliteproinfra.com www.eliteproinfra.com;

    # Two separate limits have to fit under this number:
    #   - career form resume, 5MB   (app/api/career-application/route.ts)
    #   - admin image upload, 8MB   (app/api/admin/upload/route.ts, MAX_BYTES)
    # The staging file used 8m, which is too tight: an image at exactly the
    # 8MB application limit exceeds 8m once multipart boundaries and headers
    # are counted, so nginx would 413 it before Next.js could return its own
    # readable error. 12m clears both with room to spare.
    client_max_body_size 12m;

    # --- security headers -------------------------------------------------
    # Applied at server level. Kept to the ones that cannot break this app;
    # HSTS is added by the TLS block in Phase 10, and CSP is deliberately
    # absent until it can be tested against the Google Maps iframe, Google
    # Fonts, the Instagram CDN images and the inline schema.org JSON-LD.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Do not advertise the exact nginx version in error pages and headers.
    server_tokens off;

    access_log /var/log/nginx/eliteproinfra.access.log;
    error_log  /var/log/nginx/eliteproinfra.error.log;

    # --- compression -------------------------------------------------------
    # MEASURED: the build's JS and CSS are 994.7 KB raw and 288.5 KB gzipped —
    # 706 KB, or 71%, on every cold visit. The two stylesheets alone go from
    # 227.9 KB to 43.9 KB (globals.css + Tailwind compresses 85%, the
    # FontAwesome + font sheet 76%; both are highly repetitive text).
    #
    # None of that was happening. Next's own `compress` (on by default) only
    # covers what the Node process serves, which is the HTML and the RSC
    # payload — and those were indeed arriving gzipped. But `/_next/static/`
    # below is an `alias`, served straight off disk by nginx, so every script
    # and stylesheet bypassed Node entirely. Debian's stock nginx.conf does set
    # `gzip on`, which is easy to mistake for this being handled: its default
    # `gzip_types` is `text/html` and nothing else, so CSS and JS were going
    # out uncompressed regardless.
    gzip on;

    # text/html is always compressed and must not be listed (nginx warns on a
    # duplicate). These are the types this site actually serves as text.
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 6 is the usual sweet spot: within ~2% of level 9 on this output for a
    # fraction of the CPU. The hashed assets are immutable and cached for a
    # year, so each one is compressed once per release in practice.
    gzip_comp_level 6;

    # Below ~256 bytes the gzip header costs more than it saves.
    gzip_min_length 256;

    # Compress responses coming back from the Node upstream too. Without this,
    # nginx skips anything proxied — which is most of the site.
    gzip_proxied any;

    # Vary: Accept-Encoding, so a CDN or intermediate cache never serves a
    # gzipped body to a client that did not ask for one.
    gzip_vary on;

    # Deliberately NOT compressed: JPEG/PNG/WebP/AVIF under /uploads/ and
    # /images/, and the woff2 fonts, are already compressed formats. Gzipping
    # them burns CPU to make them very slightly larger.
    #
    # Pre-compressing at build time (`gzip_static on`) would save a little more
    # again by allowing level 9 at zero per-request cost. It is not enabled
    # here because it needs ngx_http_gzip_static_module, and `nginx -t` rejects
    # the directive outright when that is missing. Check before adding it:
    #   nginx -V 2>&1 | tr ' ' '\n' | grep gzip_static

    # --- static assets ----------------------------------------------------
    # Hashed build output is immutable; cache it hard and keep it off Node.
    # The path runs through `current`, so it follows the active release.
    location /_next/static/ {
        alias /var/www/eliteproinfra/current/.next/static/;
        access_log off;
        # `expires 1y` is deliberately absent: it emits its own
        # `Cache-Control: max-age=31536000`, and together with the add_header
        # below the response carried the header twice — verified on the live
        # site, which returned both `max-age=31536000` and
        # `public, max-age=31536000, immutable`. Harmless in every browser, but
        # it is ambiguous to anything parsing the response and it hides which
        # line is authoritative. The add_header wins because it is the one that
        # carries `immutable`.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Admin uploads live outside the release directories so they survive
    # deploys and rollbacks. Served straight off disk rather than through the
    # Node process.
    location /uploads/ {
        alias /var/www/eliteproinfra/shared/uploads/;
        access_log off;
        # Same as above: one Cache-Control, not two.
        add_header Cache-Control "public, max-age=2592000" always;
        # These are user-supplied files. Never let a browser re-interpret one
        # as HTML or script, whatever its extension claims.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
    }

    # --- application ------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The App Router streams responses. With buffering on, nginx holds the
        # whole response before sending, which defeats streaming outright —
        # the Next.js self-hosting guide calls this out explicitly.
        proxy_buffering off;

        # A 5MB resume upload on a slow connection, plus the SMTP send that
        # follows it, can outlast the 60s defaults.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- health -----------------------------------------------------------
    # Same upstream as everything else, but never cached and not logged, so a
    # 30s monitor does not bloat the access log.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # --- rate-limited endpoints -------------------------------------------
    # THESE WERE MISSING FROM THIS FILE. The three zones in
    # deploy/nginx-ratelimit.conf are installed on this instance as
    # /etc/nginx/conf.d/elitepro-ratelimit.conf, but a limit_req_zone only
    # *declares* a bucket — nothing is throttled until a `limit_req` in a
    # location actually draws on it. Those directives existed only in
    # nginx-production.conf, the Hostinger file, so every zone on this box was
    # being counted into and never enforced: /api/enquiry was an open relay to
    # the company Google Workspace account, and /admin/login took unlimited
    # password guesses. Added here so the AWS deployment gets the limits the
    # repo was already designed around.
    #
    # Each block repeats the proxy settings rather than inheriting them: nginx
    # matches exactly one location per request, so a `location =` that only set
    # limit_req would have no proxy_pass and would 404. Only these four paths
    # are limited — pages and static assets deliberately are not, since one
    # page view pulls many /_next/static files.
    #
    # `nginx -t` fails with "unknown limit_req_zone" if the conf.d file above is
    # not present, so install that first; a failed test means the reload is
    # refused and the running config is untouched.

    # Unauthenticated, sends mail through the company SMTP account.
    location = /api/enquiry {
        limit_req zone=elite_forms burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Same, plus a resume attachment of up to 5MB.
    location = /api/career-application {
        limit_req zone=elite_forms burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Admin sign-in: the login page and its Server Action share this path.
    location = /admin/login {
        limit_req zone=elite_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Authenticated upload; bounds how fast a stolen session can fill the disk.
    location = /api/admin/upload {
        limit_req zone=elite_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- robots.txt ---------------------------------------------------------
    # Deliberately NOT overridden here. A staging-only block used to sit at this
    # spot returning `Disallow: /` so the new.eliteproinfra.com hostname was
    # never indexed while the real site was still on Hostinger. It was removed
    # at cutover and must not come back: on the production hostname it
    # deindexes eliteproinfra.com from Google.
    #
    # /robots.txt now falls through to `location /` and is served by the app
    # from app/robots.ts, which emits `Allow: /` plus the sitemap URL. Verified
    # live. If you ever need to block crawling again, do it there, not here —
    # one source of truth, and it ships through CI like everything else.
}
