name: Deploy to production

# Runs only after CI has passed on main. `workflow_run` is what enforces that
# ordering: a push that fails lint, typecheck, build or the dependency audit
# never reaches this workflow at all.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Manual re-deploy, e.g. to re-run after fixing something on the server.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the head of main)"
        required: false

# Never let two deploys interleave: both would be swapping the same `current`
# symlink and reloading the same PM2 process.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  # Required for OIDC. No long-lived AWS access keys exist anywhere in this
  # repository or its secrets.
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  BUCKET: elitepro-website-983814062994
  INSTANCE_ID: i-078337884c031bc59
  ROLE_ARN: arn:aws:iam::983814062994:role/elitepro-web-prod-github-deploy-role
  SITE_URL: https://eliteproinfra.com

jobs:
  deploy:
    name: Build artifact, deploy, verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip when CI failed. workflow_dispatch has no originating run, so allow
    # that through explicitly.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Resolve the commit to deploy
        id: target
        run: |
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            echo "sha=${{ github.event.inputs.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          # Check out the exact commit CI validated, not whatever is at the
          # head of main now — otherwise a push landing mid-run would deploy
          # code that was never tested.
          ref: ${{ steps.target.outputs.sha }}

      - name: Build the source artifact
        # `git archive` emits tracked files only, so node_modules, .next,
        # every .env and the quarantined _public_html snapshot are excluded
        # by construction rather than by an ignore list that could drift.
        run: |
          SHA=${{ steps.target.outputs.sha }}
          git archive --format=tar.gz -o "/tmp/${SHA}.tar.gz" "$SHA"
          echo "artifact: $(du -h /tmp/${SHA}.tar.gz | cut -f1)"

      - name: Refuse to ship anything sensitive
        run: |
          SHA=${{ steps.target.outputs.sha }}
          if tar -tzf "/tmp/${SHA}.tar.gz" \
               | grep -iE '^_public_html/|^\.env$|^\.env\.local|\.pem$|^node_modules/'; then
            echo "::error::artifact contains files that must never be deployed"
            exit 1
          fi
          echo "artifact is clean"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact to S3
        run: |
          SHA=${{ steps.target.outputs.sha }}
          aws s3 cp "/tmp/${SHA}.tar.gz" "s3://${BUCKET}/releases/${SHA}.tar.gz" --only-show-errors
          echo "uploaded releases/${SHA}.tar.gz"

      - name: Deploy over SSM
        id: ssm
        run: |
          SHA=${{ steps.target.outputs.sha }}
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deploy ${SHA:0:12}" \
            --parameters "$(jq -n --arg s "$SHA" \
                '{commands:["sudo -u elite -H bash /var/www/eliteproinfra/shared/aws-deploy.sh \($s)"],
                  executionTimeout:["1800"]}')" \
            --query Command.CommandId --output text)
          echo "command: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

          # Poll to completion. aws ssm wait has a fixed short budget that a
          # cold npm ci plus a Next build can exceed on a 2-vCPU instance.
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
                      --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "deploy script succeeded"; break ;;
              Failed|Cancelled|TimedOut) echo "::error::deploy ended as $STATUS"; break ;;
              *) sleep 10 ;;
            esac
          done

          echo "--- remote output (tail) ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text 2>/dev/null \
            | grep -vE '^Completed |MiB/s|^npm warn|^npm notice' | tail -40 || true

          ERR=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text 2>/dev/null || true)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "--- remote stderr (tail) ---"
            printf '%s\n' "$ERR" | grep -vE '^npm warn|^npm notice' | tail -20
          fi

          [ "$STATUS" = "Success" ] || exit 1

      - name: Verify the live site is serving this commit
        # The deploy script already health-gates and self-rolls-back, but this
        # checks from OUTSIDE the box: DNS, TLS, nginx and the app together. A
        # completed SSM command is not evidence that the public site works.
        run: |
          SHORT=$(echo "${{ steps.target.outputs.sha }}" | cut -c1-12)
          for i in $(seq 1 20); do
            BODY=$(curl -fsS --max-time 15 "${SITE_URL}/health" 2>/dev/null) || { sleep 5; continue; }
            STATUS=$(printf '%s' "$BODY" | jq -r '.status // empty')
            COMMIT=$(printf '%s' "$BODY" | jq -r '.commit // empty')
            echo "attempt $i: status=$STATUS commit=$COMMIT (want ok/$SHORT)"
            if [ "$STATUS" = "ok" ] && [ "$COMMIT" = "$SHORT" ]; then
              echo "live site is healthy and serving $SHORT"
              HOME_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SITE_URL}/")
              echo "homepage: $HOME_CODE"
              [ "$HOME_CODE" = "200" ] || { echo "::error::homepage returned $HOME_CODE"; exit 1; }
              exit 0
            fi
            sleep 5
          done
          echo "::error::live site did not report healthy on commit $SHORT"
          exit 1

      - name: Report
        if: always()
        run: |
          SHORT=$(echo "${{ steps.target.outputs.sha }}" | cut -c1-12)
          {
            echo "### Deployment ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHORT\` |"
            echo "| Site | ${SITE_URL} |"
            echo "| SSM command | \`${{ steps.ssm.outputs.cmd_id }}\` |"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "The deploy script rolls back automatically when its own health"
              echo "check fails. To roll back by hand:"
              echo ""
              echo '```'
              echo "aws ssm send-command --instance-ids $INSTANCE_ID \\"
              echo "  --document-name AWS-RunShellScript --region $AWS_REGION \\"
              echo "  --parameters 'commands=[\"sudo -u elite -H bash /var/www/eliteproinfra/shared/aws-rollback.sh\"]'"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
